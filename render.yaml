services:
  - type: web
    name: takemyskins-automator
    runtime: docker
    region: oregon
    plan: free
    
    # Port mapping
    envVars:
      - key: PORT
        value: 8080
      - key: SELF_PING_INTERVAL
        value: 600  # 10 minutes - prevents spin-down
      - key: SCHEDULER_INTERVAL
        value: 21600  # 6 hours - raffle check interval
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DISPLAY
        value: ":99"
      - key: ACTIVE_STEAM_ID
        # Pin this server to one account (SteamID64). Each Render service
        # gets its own value but they can share the same Redis:
        #   server 1 -> 76561198842774198 (Fr4me)
        #   server 2 -> 76561198662673877 (Forever kid)
        #   server 3 -> 76561198640302648 (kriddtiktok)
        # Empty = old shared behaviour (session:active key decides).
        value: ""
    
    # Health check (prevents false "crashed" alerts)
    healthCheckPath: /healthz
    healthCheckInterval: 30  # seconds
    
    # Auto-deploy on git push
    autoDeploy: true
